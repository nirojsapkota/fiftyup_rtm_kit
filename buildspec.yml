version: 0.2
env:
  parameter-store:
    AWS_ACCESS_KEY_ID: "component-website-access-key"
    AWS_SECRET_ACCESS_KEY: "component-website-secret-key"

phases:
  install:
    commands:
      - npm install -g npm
      - npm install -g lerna
      - git checkout master
      - echo "$NPM_REGISTRY_LOGIN_URL:_authToken=$NPM_AUTH_TOKEN" >> $HOME/.npmrc
      - echo "@rtm-ui:registry=https:$NPM_REGISTRY_LOGIN_URL" >> $HOME/.npmrc
      - echo "always-auth=true" >> $HOME/.npmrc
      - echo "registry=http://registry.npmjs.org/" >> $HOME/.npmrc
      - git remote set-url origin $GITHUB_URL
      - git config --global user.email $GIT_USER_EMAIL
      - git config --global user.name $GIT_USERNAME
      - npm set unsafe-perm true
  pre_build:
    commands:
      - cat $HOME/.npmrc
      - lerna bootstrap --no-ci --hoist
  build:
    commands:
      - npm run test
      - npm run release
  post_build:
    commands:
      - if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ] ; then exit 1; fi
      - aws s3 cp ./dist/ s3://$CDN_BUCKET_NAME/rtm-ui/libs --acl public-read  --include "*.min.js" --recursive

artifacts:
  files:
    - "dist/**"
    - "*/build/**"
  discard-paths: yes
  base-directory: "packages"

version: 0.2
phases:
  install:
    commands:
      - echo "$NPM_REGISTRY_LOGIN_URL:_authToken=$NPM_AUTH_TOKEN" >> .npmrc
      - echo "registry=https:$NPM_REGISTRY_LOGIN_URL" >> .npmrc
      - echo "always-auth=true" >> .npmrc
      - npm set unsafe-perm false
      - npm install -g npm
      - npm install -g lerna
  pre_build:
    commands:
    - npm -v
    - cat .npmrc
    - npm run lerna-bootstrap
  build:
    commands:
      - npm run test
      - npm run release

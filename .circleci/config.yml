workflows:
  version: 2
  main:
    jobs:
      - unit-node8
      - lint


version: 2
jobs:
  unit-node8:
    docker:
      - image: circleci/node:8
    steps:
      - checkout
      - run:
          name: "Unit test with Node.js 8"
          command: |
            yarn run bootstrap
            yarn jest -w 1
  lint:
    docker:
      - image: circleci/node:8
    steps:
      - checkout
      - run:
          name: "Lint Code"
          command: |
            yarn install
            yarn lint

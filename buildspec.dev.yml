version: 0.2
env:
  parameter-store:
    GIT_USER_EMAIL: "github-user-email"
    NPM_AUTH_TOKEN: "/aws/reference/secretsmanager/npm-access-token"
    NPM_REGISTRY_LOGIN_URL: "npm-repository-auth-url"

phases:
  install:
    commands:
      - echo "Running on branch `git name-rev --name-only --always $CODEBUILD_RESOLVED_SOURCE_VERSION 2>/dev/null`"
      - npm install -g npm
      - npm install -g lerna
      - echo "$NPM_REGISTRY_LOGIN_URL:_authToken=$NPM_AUTH_TOKEN" >> $HOME/.npmrc
      - echo "@rtm-ui:registry=https:$NPM_REGISTRY_LOGIN_URL" >> $HOME/.npmrc
      - echo "always-auth=true" >> $HOME/.npmrc
      - echo "registry=http://registry.npmjs.org/" >> $HOME/.npmrc
      - npm set unsafe-perm true
  pre_build:
    commands:
      - lerna bootstrap --no-ci --hoist
  build:
    commands:
      - npm run test

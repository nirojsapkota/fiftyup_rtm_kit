version: 0.2
env:
  parameter-store:
    GIT_USER_EMAIL: "github-user-email"
    NPM_AUTH_TOKEN: "/aws/reference/secretsmanager/npm-access-token"
    NPM_REGISTRY_LOGIN_URL: "npm-repository-auth-url"

phases:
  install:
    commands:
      - echo "Running on branch `git name-rev --name-only --always $CODEBUILD_RESOLVED_SOURCE_VERSION 2>/dev/null`"
      - npm install -g npm
      - npm install -g lerna
      - npm set registry http://registry.npmjs.org/
      - npm set always-auth true
      - npm set unsafe-perm true
      - echo "$NPM_REGISTRY_LOGIN_URL:_authToken=$NPM_AUTH_TOKEN" >> $HOME/.npmrc
      - echo "@rtm-ui:registry=https:$NPM_REGISTRY_LOGIN_URL" >> $HOME/.npmrc
      - mkdir ./aws/tmp
      - cd ./aws/GithubDocumentationFunction/ && npm install
      - zip -r ../tmp/GithubDocumentationFunction.zip . && cd ../../
      - aws lambda update-function-code --function-name GithubDocumentationFunction --zip-file fileb://./aws/tmp/GithubDocumentationFunction.zip --publish

  pre_build:
    commands:
      - npm install
      - lerna bootstrap --no-ci
      - lerna run build --parallel
  build:
    commands:
      - export DOCZ_BASE=/$CODEBUILD_WEBHOOK_TRIGGER/
      - echo $DOCZ_BASE
      - npm run test
      - npm run build
  post_build:
    commands:
      - if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ] ; then exit 1; fi
      - aws s3 cp ./.docz/dist s3://$DOCS_BUCKET_NAME/$CODEBUILD_WEBHOOK_TRIGGER --acl public-read --recursive
      - aws lambda invoke --function-name GithubDocumentationFunction --payload '{"bucket":"'"${DOCS_BUCKET_NAME}"'", "codebuild_trigger":"'"${CODEBUILD_WEBHOOK_TRIGGER}"'"}' response6.txt
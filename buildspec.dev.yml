version: 0.2
phases:
  install:
    commands:
      - export NODE_OPTIONS="--openssl-legacy-provider"
      - npm install -g npm@6.14.11
      - npm install
      - npm config list
      - git status

  pre_build:
    commands:
      - if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ] ; then exit 1; fi
      - npm run bootstrap
      - npm run build:ci

  build:
    commands:
      - if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ] ; then exit 1; fi
      - npm run test:ci
      - npm run copy:builds
      - npm run build:docs

artifacts:
  secondary-artifacts:
    api:
      base-directory: .docz/dist
      files:
        - '**/*'
    ui:
      base-directory: .docz/dist
      files:
        - '**/*'

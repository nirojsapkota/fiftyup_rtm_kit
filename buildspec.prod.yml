version: 0.2
env:
  parameter-store:
    GIT_USER_EMAIL: 'github-user-email'
    GIT_USER_NAME: 'github-user-name'

phases:
  install:
    commands:
      - npm install -g npm
      - git remote set-url origin $GITHUB_URL
      - git fetch
      - git config --global user.email $GIT_USER_EMAIL
      - git config --global user.name $GIT_USER_NAME
      - git checkout master
      - npm install

  pre_build:
    commands:
      - npm run bootstrap
      - npm run build:ci

  build:
    commands:
      - if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ] ; then exit 1; fi
      - npm run test:ci
      - npm run copy:builds
      - npm run build:docs

  post_build:
    commands:
      - if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ] ; then exit 1; fi
      - npm run release

artifacts:
  secondary-artifacts:
    api:
      base-directory: .docz/dist
      files:
        - '**/*'
    ui:
      base-directory: .docz/dist
      files:
        - '**/*'

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master

permissions:
  id-token: write   # required for aws-actions/configure-aws-credentials OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  CODEARTIFACT_DOMAIN: rtm-kit
  CODEARTIFACT_REPOSITORY: rtm-kit-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure AWS credentials (CodeArtifact reader role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_READER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure npm for CodeArtifact
        run: |
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --repository "$CODEARTIFACT_REPOSITORY"

      - run: node --version && npm --version
      - run: npm install -g npm@6.14.11
      - run: npm install
      - run: npm run bootstrap
      - run: npm run build:ci
      - run: npm run lint
      - run: npm run test:ci

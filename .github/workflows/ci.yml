name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master

permissions:
  id-token: write   # required for aws-actions/configure-aws-credentials OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  CODEARTIFACT_DOMAIN: rtm-kit
  CODEARTIFACT_REPOSITORY: rtm-kit-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: DEBUG - print OIDC token claims (temporary)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          # base64url decode with padding
          PAYLOAD="${PAYLOAD}$(printf '%.0s=' $(seq 1 $(( (4 - ${#PAYLOAD} % 4) % 4 ))))"
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref, event_name}'

      - name: Configure AWS credentials (CodeArtifact reader role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_READER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure npm for CodeArtifact
        run: |
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --repository "$CODEARTIFACT_REPOSITORY"

      - run: node --version && npm --version
      - run: npm install -g npm@6.14.11
      - run: npm install
      - run: npm run bootstrap
      - run: npm run build:ci
      - run: npm run lint
      - run: npm run test:ci

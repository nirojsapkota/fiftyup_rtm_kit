name: Terraform (registry infra)

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - master
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: '1.5.7'

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra

      - name: Terraform init
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform init

      - name: Terraform validate
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform plan -input=false

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # dev is applied before prod: prod's shared resources (OIDC provider, ACM cert,
    # custom domain) are looked up from what dev already created.
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform init

      - name: Terraform apply
        working-directory: infra/envs/${{ matrix.environment }}
        run: terraform apply -auto-approve -input=false

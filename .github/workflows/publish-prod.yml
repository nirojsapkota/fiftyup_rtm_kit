name: Publish (prod)

# Replaces buildspec.prod.yml. Runs on pushes to master, mirroring the previous CodeBuild "prod"
# project's trigger.
on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write   # lerna publish commits version bumps + tags back to the repo

env:
  AWS_REGION: ap-southeast-2
  CODEARTIFACT_DOMAIN: rtm-kit
  CODEARTIFACT_REPOSITORY: rtm-kit-prod

jobs:
  publish-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # lerna needs full history/tags to determine version bumps
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Configure git identity
        run: |
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"

      - name: Configure AWS credentials (CodeArtifact publisher role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure npm for CodeArtifact
        run: |
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --repository "$CODEARTIFACT_REPOSITORY"

      - run: npm install -g npm@6.14.11
      - run: npm install
      - run: npm config list

      - run: npm run bootstrap
      - run: npm run build:ci

      - run: npm run test:ci
      - run: npm run copy:builds
      - run: npm run build:docs

      # Bumps versions per conventional commits, tags, commits back to master, and publishes
      # to the prod CodeArtifact repository — equivalent to buildspec.prod.yml's `npm run release`.
      - run: npm run release

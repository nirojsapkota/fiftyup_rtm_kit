name: Publish (dev)

# Replaces buildspec.dev.yml. Runs only on pushes to develop, so dev builds/publishes don't
# fire for every feature branch (ci.yml still covers those).
on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  CODEARTIFACT_DOMAIN: rtm-kit
  CODEARTIFACT_REPOSITORY: rtm-kit-dev

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Configure AWS credentials (CodeArtifact publisher role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure npm for CodeArtifact
        run: |
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --repository "$CODEARTIFACT_REPOSITORY"

      - run: npm install -g npm@6.14.11
      - run: npm install
      - run: npm config list

      - run: npm run bootstrap
      - run: npm run build:ci

      - run: npm run test:ci
        continue-on-error: true
      - run: npm run copy:builds
      - run: npm run build:docs

      # Publishes prerelease/snapshot versions to the dev CodeArtifact repository so
      # feature branches can be consumed for testing without touching prod. lerna.json's
      # "command.publish.registry" defaults to the prod custom-domain URL, so this
      # explicitly overrides it — but only ever with the custom-domain URL. When
      # enable_custom_domain=false (e.g. an account/domain not yet wired up for dev), that
      # URL doesn't resolve. Instead, rely on the npm registry already configured by
      # `aws codeartifact login` above (the real CodeArtifact endpoint, works either way)
      # by not overriding --registry at all.
      - run: |
          npx lerna publish --yes --canary --dist-tag dev --no-push --no-git-tag-version

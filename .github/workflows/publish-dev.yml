name: Publish (dev)

# Replaces buildspec.dev.yml. Runs only on pushes to develop, so dev builds/publishes don't
# fire for every feature branch (ci.yml still covers those).
on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  CODEARTIFACT_DOMAIN: rtm-kit
  CODEARTIFACT_REPOSITORY: rtm-kit-dev

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Configure AWS credentials (CodeArtifact publisher role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure npm for CodeArtifact
        run: |
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --repository "$CODEARTIFACT_REPOSITORY"

      - run: npm install -g npm@6.14.11
      - run: npm install
      - run: npm config list

      - run: npm run bootstrap
      - run: npm run build:ci

      - run: npm run test:ci
        continue-on-error: true
      - run: npm run copy:builds
      - run: npm run build:docs

      # Publishes prerelease/snapshot versions to the dev CodeArtifact repository so
      # feature branches can be consumed for testing without touching prod. lerna.json's
      # "command.publish.registry" defaults to the *prod* custom-domain URL
      # (repo.fiftyupclub.com), so this must always be overridden for dev publishes.
      # `aws codeartifact login` above only configures npm's local .npmrc - lerna publish
      # ignores that and always uses lerna.json's registry setting unless --registry is
      # passed explicitly. Fetch the real CodeArtifact repository endpoint directly from
      # AWS at runtime (works whether or not the repo.fiftyupclub.com custom domain proxy
      # is wired up) instead of hardcoding a URL here.
      - name: Resolve CodeArtifact registry URL
        run: |
          REGISTRY_URL=$(aws codeartifact get-repository-endpoint \
            --domain "$CODEARTIFACT_DOMAIN" \
            --repository "$CODEARTIFACT_REPOSITORY" \
            --format npm \
            --query repositoryEndpoint \
            --output text)
          echo "REGISTRY_URL=$REGISTRY_URL" >> "$GITHUB_ENV"

      - run: |
          npx lerna publish --yes --canary --dist-tag dev --no-push --no-git-tag-version \
            --registry "$REGISTRY_URL"
